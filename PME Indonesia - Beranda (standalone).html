document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

h))),\n               0 2px 6px rgba(16,40,70,calc(.05 * var(--shadow-strength)));\n  --shadow-md: 0 6px 18px rgba(16,40,70,calc(.08 * var(--shadow-strength))),\n               0 2px 6px rgba(16,40,70,calc(.05 * var(--shadow-strength)));\n  --shadow-lg: 0 18px 50px rgba(16,40,70,calc(.14 * var(--shadow-strength))),\n               0 6px 16px rgba(16,40,70,calc(.07 * var(--shadow-strength)));\n\n  /* ---- type (tweakable family) ---- */\n  --font-head: 'Sora', system-ui, sans-serif;\n  --font-body: 'Plus Jakarta Sans', system-ui, sans-serif;\n\n  --maxw: 1240px;\n}\n\n*{box-sizing:border-box}\nhtml{-webkit-text-size-adjust:100%}\nbody{\n  margin:0;\n  font-family:var(--font-body);\n  color:var(--ink);\n  background:var(--bg);\n  line-height:1.6;\n  -webkit-font-smoothing:antialiased;\n  text-rendering:optimizeLegibility;\n}\nh1,h2,h3,h4,h5{font-family:var(--font-head);margin:0;line-height:1.12;color:var(--ink);font-weight:700;letter-spacing:-.01em}\np{margin:0}\na{color:inherit;text-decoration:none}\nimg{max-width:100%;display:block}\nbutton{font-family:inherit}\nul{margin:0;padding:0;list-style:none}\n\n.wrap{max-width:var(--maxw);margin:0 auto;padding:0 28px}\n.section{padding:84px 0}\n.section-sm{padding:56px 0}\n\n/* ---------- eyebrow / headings ---------- */\n.eyebrow{\n  display:inline-flex;align-items:center;gap:8px;\n  font-family:var(--font-head);font-weight:700;font-size:12.5px;\n  letter-spacing:.16em;text-transform:uppercase;color:var(--accent);\n}\n.eyebrow::before{content:\"\";width:22px;height:2px;background:var(--accent);border-radius:2px}\n.eyebrow.center{justify-content:center}\n.h-xxl{font-size:clamp(34px,5vw,60px);font-weight:800;letter-spacing:-.025em}\n.h-xl{font-size:clamp(28px,3.6vw,42px);font-weight:800;letter-spacing:-.02em}\n.h-lg{font-size:clamp(23px,2.4vw,32px);font-weight:700}\n.lead{font-size:clamp(16px,1.3vw,18.5px);color:var(--ink-2);line-height:1.7}\n.muted{color:var(--muted)}\n.section-head{max-width:680px}\n.section-head.center{margin:0 auto;text-align:center}\n.section-head .h-xl{margin:14px 0 0}\n.section-head p{margin-top:16px}\n\n/* ---------- buttons ---------- */\n.btn{\n  display:inline-flex;align-items:center;justify-content:center;gap:9px;\n  font-family:var(--font-head);font-weight:600;font-size:15px;\n  padding:13px 24px;border-radius:var(--pill);border:1.5px solid transparent;\n  cursor:pointer;transition:transform .16s ease, box-shadow .2s ease, background .2s, color .2s, border-color .2s;\n  white-space:nowrap;\n}\n.btn:active{transform:translateY(1px)}\n.btn-primary{background:var(--accent);color:#fff;box-shadow:0 8px 20px rgba(20,87,181,calc(.28*var(--shadow-strength)))}\n.btn-primary:hover{background:var(--accent-600);box-shadow:0 12px 26px rgba(20,87,181,calc(.34*var(--shadow-strength)))}\n.btn-ghost{background:#fff;color:var(--ink);border-color:var(--line)}\n.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}\n.btn-dark{background:var(--ink);color:#fff}\n.btn-dark:hover{background:#000}\n.btn-cyan{background:var(--cyan);color:#fff}\n.btn-cyan:hover{filter:brightness(.95)}\n.btn-sm{padding:10px 18px;font-size:13.5px}\n.btn-lg{padding:16px 30px;font-size:16px}\n.btn .ar{transition:transform .18s ease}\n.btn:hover .ar{transform:translateX(3px)}\n\n.link-more{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-head);font-weight:600;color:var(--accent);font-size:14.5px}\n.link-more .ar{transition:transform .18s ease}\n.link-more:hover .ar{transform:translateX(3px)}\n\n/* ---------- chips / badges ---------- */\n.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;font-family:var(--font-head);\n  padding:5px 11px;border-radius:var(--pill);background:var(--accent-soft);color:var(--accent-700)}\n.badge{display:inline-flex;align-items:center;font-family:var(--font-head);font-weight:700;font-size:11px;\n  letter-spacing:.04em;text-transform:uppercase;padding:5px 10px;border-radius:7px}\n.badge-best{background:#FFF1E6;color:#C2620E}\n.badge-new{background:var(--accent-soft);color:var(--accent-700)}\n.badge-disc{background:#FDECEA;color:var(--red)}\n\n/* ============================================================\n   HEADER\n   ============================================================ */\n.topbar{background:var(--dark);color:#cfe0f2;font-size:13px}\n.topbar .wrap{display:flex;align-items:center;justify-content:space-between;height:42px;gap:18px}\n.topbar a{color:#cfe0f2;transition:color .15s}\n.topbar a:hover{color:#fff}\n.topbar .tb-left{display:flex;align-items:center;gap:22px;flex-wrap:wrap}\n.topbar .tb-item{display:flex;align-items:center;gap:8px;white-space:nowrap}\n.topbar .tb-item svg{width:15px;height:15px;color:var(--cyan)}\n.topbar .tb-right{display:flex;align-items:center;gap:16px}\n.topbar .socials{display:flex;align-items:center;gap:12px}\n.topbar .socials a{display:grid;place-items:center}\n.topbar .socials svg{width:15px;height:15px}\n\n.header{position:sticky;top:0;z-index:90;background:rgba(255,255,255,.92);\n  backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}\n.header .wrap{display:flex;align-items:center;gap:26px;height:78px}\n.brand{display:flex;align-items:center;flex-shrink:0}\n.brand img{height:44px;width:auto}\n.searchbar{flex:1;display:flex;align-items:center;max-width:560px;\n  background:var(--bg-soft);border:1.5px solid var(--line);border-radius:var(--pill);\n  padding:0 6px 0 18px;height:48px;transition:border-color .2s, background .2s}\n.searchbar:focus-within{border-color:var(--accent);background:#fff}\n.searchbar input{flex:1;border:0;background:transparent;outline:none;font-family:inherit;font-size:14.5px;color:var(--ink)}\n.searchbar input::placeholder{color:var(--faint)}\n.searchbar button{width:38px;height:38px;border:0;border-radius:var(--pill);background:var(--accent);color:#fff;\n  display:grid;place-items:center;cursor:pointer;transition:background .2s}\n.searchbar button:hover{background:var(--accent-600)}\n.header .h-right{display:flex;align-items:center;gap:20px;margin-left:auto}\n.h-account{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--ink-2);white-space:nowrap}\n.h-account a:hover{color:var(--accent)}\n.h-cart{position:relative;display:grid;place-items:center;width:46px;height:46px;border-radius:var(--pill);\n  background:var(--bg-soft);border:1.5px solid var(--line);color:var(--ink);transition:.2s}\n.h-cart:hover{border-color:var(--accent);color:var(--accent)}\n.h-cart .count{position:absolute;top:-3px;right:-3px;min-width:19px;height:19px;padding:0 4px;border-radius:var(--pill);\n  background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}\n\n/* main nav */\n.nav{border-bottom:1px solid var(--line);background:#fff}\n.nav .wrap{display:flex;align-items:center;gap:6px;height:54px;overflow:auto;scrollbar-width:none}\n.nav .wrap::-webkit-scrollbar{display:none}\n.nav a{font-family:var(--font-head);font-weight:600;font-size:14px;color:var(--ink-2);\n  padding:9px 15px;border-radius:var(--radius-sm);white-space:nowrap;transition:.16s;position:relative}\n.nav a:hover{color:var(--accent);background:var(--accent-tint)}\n.nav a.active{color:var(--accent)}\n.nav a.active::after{content:\"\";position:absolute;left:15px;right:15px;bottom:-1px;height:2.5px;background:var(--accent);border-radius:2px}\n.nav .quote-link{margin-left:auto;color:var(--accent)}\n\n.hamburger{display:none;width:46px;height:46px;border-radius:var(--radius-sm);border:1.5px solid var(--line);\n  background:#fff;cursor:pointer;align-items:center;justify-content:center;flex-direction:column;gap:4px}\n.hamburger span{width:20px;height:2px;background:var(--ink);border-radius:2px}\n\n/* ============================================================\n   FOOTER\n   ============================================================ */\n.footer{background:var(--dark);color:#aebfd2;margin-top:0}\n.footer .ftop{padding:72px 0 48px}\n.footer .fgrid{display:grid;grid-t
